<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IRON">
<meta name="theme-color" content="#C9A84C">
<title>IRON PROGRAMME</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--gold:#C9A84C;--gold-bright:#E8C96A;--gold-muted:#8A6E30;--gold-dark:#5A4820;--iron:#0A0A0B;--iron-2:#111114;--iron-3:#18181D;--iron-4:#1E1E25;--steel:#2A2A35;--text-main:#E8E8F0;--text-muted:#7A7A9A;--text-dim:#4A4A6A;--green:#27AE60;--red:#C0392B;--r:6px;--rl:10px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-text-size-adjust:100%;height:-webkit-fill-available}
body{background:var(--iron);color:var(--text-main);font-family:'Barlow',sans-serif;min-height:100vh;min-height:-webkit-fill-available;overflow-x:hidden}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--iron-2)}::-webkit-scrollbar-thumb{background:var(--gold-dark);border-radius:2px}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
#main-content{flex:1;padding:0 16px 90px;transition:opacity .15s ease;overflow-y:auto}
/* TOP BAR */
#top-bar{background:var(--iron-2);border-bottom:1px solid var(--gold-dark);padding:14px 16px 10px;position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between}
.app-brand{font-family:'Bebas Neue',cursive;font-size:20px;letter-spacing:3px;color:var(--gold);line-height:1}
.app-brand span{color:var(--text-muted);font-size:10px;font-family:'Barlow Condensed',sans-serif;display:block;letter-spacing:4px;margin-top:1px}
.offline-badge{font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:2px;color:var(--gold-muted);border:1px solid var(--gold-dark);padding:2px 6px;border-radius:2px}
/* BOTTOM NAV */
#bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--iron-2);border-top:1px solid var(--gold-dark);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.nav-btn{flex:1;background:none;border:none;color:var(--text-dim);padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent}
.nav-btn.active{color:var(--gold)}.nav-btn.active .nav-icon{transform:scale(1.15)}
.nav-icon{font-size:20px;transition:transform .15s}.nav-label{font-family:'Barlow Condensed',sans-serif;font-size:9px;letter-spacing:1.5px;font-weight:700}
/* VIEW HEADER */
.view-header{display:flex;align-items:flex-start;justify-content:space-between;padding:20px 0 12px}
.view-title{font-family:'Bebas Neue',cursive;font-size:28px;letter-spacing:4px;color:var(--gold);line-height:1}
.view-sub{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:2px;color:var(--text-muted);margin-top:4px;text-transform:uppercase}
.completed-badge{background:var(--green);color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:2px;font-weight:700;padding:4px 10px;border-radius:var(--r);align-self:center}
/* QUOTE */
.quote-block{background:var(--iron-3);border-left:3px solid var(--gold);border-radius:0 var(--r) var(--r) 0;padding:14px 16px;margin-bottom:16px}
.quote-text{font-style:italic;font-size:13px;color:var(--text-main);line-height:1.5;transition:opacity .4s ease}
.quote-attr{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:2px;color:var(--gold-muted);margin-top:6px;text-transform:uppercase}
/* DATE */
.date-display{font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:2px;color:var(--text-muted);text-transform:uppercase;margin-bottom:12px}
/* WORKOUT HEADER */
.workout-header-card{background:linear-gradient(135deg,var(--iron-4) 0%,var(--iron-3) 100%);border:1px solid var(--gold-dark);border-radius:var(--rl);padding:18px;margin-bottom:16px;position:relative;overflow:hidden}
.workout-header-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--gold),transparent)}
.workout-day-name{font-family:'Bebas Neue',cursive;font-size:32px;letter-spacing:5px;color:var(--gold);line-height:1}
.workout-muscles{font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:2px;color:var(--text-muted);margin-top:4px;text-transform:uppercase}
/* EXERCISE CARDS */
.exercises-list{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.exercise-card{background:var(--iron-3);border:1px solid var(--steel);border-radius:var(--rl);padding:14px;transition:border-color .2s;animation:fadeIn .3s ease forwards;opacity:0}
.exercise-card:focus-within{border-color:var(--gold-dark)}
.ex-header{display:flex;gap:12px;margin-bottom:12px}
.ex-num{font-family:'Bebas Neue',cursive;font-size:26px;color:var(--gold-dark);line-height:1;min-width:30px;letter-spacing:1px}
.ex-info{flex:1}
.ex-name{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;letter-spacing:1px;color:var(--text-main);line-height:1.2}
.ex-prescription{font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:1px;color:var(--gold-muted);margin-top:3px;text-transform:uppercase}
.ex-notes{font-size:12px;color:var(--text-muted);margin-top:4px;font-style:italic;line-height:1.3}
/* SET ROWS */
.sets-container{border-top:1px solid var(--steel);padding-top:10px}
.sets-header-row{display:grid;grid-template-columns:30px 1fr 1fr 36px;gap:6px;margin-bottom:6px}
.sets-col-label{font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:2px;color:var(--text-dim);text-align:center;text-transform:uppercase}
.set-row{display:grid;grid-template-columns:30px 1fr 1fr 36px;gap:6px;align-items:center;margin-bottom:6px}
.set-num{font-family:'Bebas Neue',cursive;font-size:16px;color:var(--text-muted);text-align:center}
.set-input{background:var(--iron-4);border:1px solid var(--steel);border-radius:var(--r);color:var(--text-main);font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:600;letter-spacing:1px;padding:7px 8px;text-align:center;width:100%;-webkit-appearance:none;transition:border-color .2s}
.set-input:focus{outline:none;border-color:var(--gold);background:var(--iron-3)}
.set-input::placeholder{color:var(--text-dim);font-size:12px}
.set-check{width:36px;height:36px;background:var(--iron-4);border:1px solid var(--steel);border-radius:var(--r);color:var(--gold);font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;-webkit-tap-highlight-color:transparent}
.set-check.set-done{background:var(--gold-dark);border-color:var(--gold);color:var(--gold-bright)}
/* CARDIO */
.cardio-card{background:linear-gradient(135deg,var(--iron-4) 0%,#1A1510 100%);border:1px solid var(--gold-dark);border-radius:var(--rl);padding:16px;margin-bottom:16px}
.cardio-header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cardio-icon{font-size:18px}
.cardio-title{font-family:'Bebas Neue',cursive;font-size:18px;letter-spacing:3px;color:var(--gold)}
.cardio-type{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;letter-spacing:1px;color:var(--text-main);margin-bottom:4px}
.cardio-detail{font-size:13px;color:var(--text-muted);margin-bottom:12px}
.cardio-check{display:flex;align-items:center;gap:10px;cursor:pointer}
.cardio-check input[type="checkbox"]{width:20px;height:20px;accent-color:var(--gold);cursor:pointer}
.check-label{font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:2px;color:var(--text-muted);text-transform:uppercase}
/* COMPLETE */
.complete-section{margin-bottom:16px;text-align:center}
.complete-btn{width:100%;padding:16px;background:linear-gradient(135deg,var(--gold-dark),var(--gold));border:none;border-radius:var(--rl);color:var(--iron);font-family:'Bebas Neue',cursive;font-size:20px;letter-spacing:4px;cursor:pointer;transition:all .2s;-webkit-tap-highlight-color:transparent}
.complete-btn:active{transform:scale(.98)}
.complete-btn.completed{background:linear-gradient(135deg,#1A3A1A,var(--green));color:#fff}
.autosave-status{font-size:11px;color:var(--text-dim);margin-top:6px;font-style:italic;letter-spacing:1px}
/* DATE NAV */
.date-nav{display:flex;gap:8px;margin-bottom:24px}
.date-nav-btn{flex:1;background:var(--iron-3);border:1px solid var(--steel);border-radius:var(--r);color:var(--text-muted);font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:2px;padding:10px 8px;cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent;text-transform:uppercase}
.date-nav-btn:active{background:var(--iron-4)}
.today-btn{background:var(--gold-dark);border-color:var(--gold-muted);color:var(--gold-bright)}
/* REST CARD */
.rest-card{background:var(--iron-3);border:1px solid var(--steel);border-radius:var(--rl);padding:32px 20px;text-align:center;margin-bottom:16px}
.rest-icon{font-size:48px;margin-bottom:12px}
.rest-card h2{font-family:'Bebas Neue',cursive;font-size:30px;letter-spacing:5px;color:var(--gold);margin-bottom:8px}
.rest-card p{color:var(--text-muted);font-size:14px}
.rest-tips{margin-top:20px;display:flex;flex-direction:column;gap:10px}
.tip{background:var(--iron-4);border-radius:var(--r);padding:10px 14px;font-size:13px;color:var(--text-muted);text-align:left}
/* CALENDAR */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-nav-btn{background:var(--iron-3);border:1px solid var(--steel);border-radius:var(--r);color:var(--gold);font-size:16px;padding:8px 14px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.cal-month-name{font-family:'Bebas Neue',cursive;font-size:22px;letter-spacing:4px;color:var(--gold)}
.cal-legend{display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.leg{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:1px;color:var(--text-muted)}
.leg-done{color:var(--green)}.leg-workout{color:var(--gold)}.leg-missed{color:var(--red)}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:20px}
.cal-weekday{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:1px;color:var(--text-dim);text-align:center;padding:4px 0;text-transform:uppercase}
.cal-cell{aspect-ratio:1;background:var(--iron-3);border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;transition:all .15s;border:1px solid transparent;-webkit-tap-highlight-color:transparent}
.cal-cell.empty{background:transparent;cursor:default}
.cal-cell:active:not(.empty){transform:scale(.92)}
.cal-today{border-color:var(--gold-muted)}.cal-selected{border-color:var(--gold);background:var(--gold-dark)}
.cal-inactive{opacity:.2}.cal-rest{background:var(--iron-4)}.cal-done{background:#0D2010;border-color:#1A4020}
.cal-workout{background:#1A1508}.cal-missed{background:#1A0808;opacity:.7}
.cal-day-num{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:600;color:var(--text-main)}
.cal-dot{font-size:9px;line-height:1}.done-dot{color:var(--green)}.rest-dot{color:var(--text-dim)}
/* PROGRESS */
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.stat-card{background:var(--iron-3);border:1px solid var(--steel);border-radius:var(--rl);padding:16px;text-align:center}
.stat-value{font-family:'Bebas Neue',cursive;font-size:36px;letter-spacing:2px;color:var(--gold);line-height:1}
.stat-label{font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:2px;color:var(--text-muted);margin-top:4px;text-transform:uppercase}
.progress-bar-container{background:var(--iron-3);border:1px solid var(--steel);border-radius:var(--rl);padding:14px;margin-bottom:20px}
.progress-bar-label{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:2px;color:var(--text-muted);margin-bottom:8px;text-transform:uppercase}
.progress-bar-track{background:var(--iron-4);border-radius:4px;height:8px;overflow:hidden}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--gold-dark),var(--gold));border-radius:4px;transition:width .6s ease}
.progress-bar-pct{font-family:'Bebas Neue',cursive;font-size:18px;letter-spacing:2px;color:var(--gold);margin-top:6px;text-align:right}
.weight-section{margin-bottom:20px}
.section-title{font-family:'Bebas Neue',cursive;font-size:18px;letter-spacing:3px;color:var(--gold);margin-bottom:12px}
.weight-input-row{display:flex;gap:8px;margin-bottom:16px}
.weight-input{flex:1;background:var(--iron-3);border:1px solid var(--steel);border-radius:var(--r);color:var(--text-main);font-family:'Barlow Condensed',sans-serif;font-size:16px;letter-spacing:1px;padding:12px 14px;-webkit-appearance:none}
.weight-input:focus{outline:none;border-color:var(--gold)}
.gold-btn{background:linear-gradient(135deg,var(--gold-dark),var(--gold));border:none;border-radius:var(--r);color:var(--iron);font-family:'Bebas Neue',cursive;font-size:16px;letter-spacing:2px;padding:12px 20px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.gold-btn:active{opacity:.8}
.chart-container{background:var(--iron-3);border:1px solid var(--steel);border-radius:var(--rl);padding:16px;margin-bottom:12px}
.weight-chart{width:100%;height:80px;display:block}
.chart-labels{display:flex;justify-content:space-between;margin-top:8px}
.chart-labels span{font-family:'Barlow Condensed',sans-serif;font-size:11px;color:var(--text-dim)}
.change-label{font-weight:700}.change-label.neg{color:var(--green)}.change-label.pos{color:var(--red)}
.weight-history{display:flex;flex-direction:column;gap:6px}
.weight-entry{display:flex;justify-content:space-between;align-items:center;background:var(--iron-3);border-radius:var(--r);padding:10px 14px}
.we-date{font-size:13px;color:var(--text-muted)}
.we-val{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;color:var(--gold)}
.no-data{font-size:13px;color:var(--text-muted);text-align:center;padding:20px;font-style:italic}
/* MACROS */
.macros-type-toggle{display:flex;gap:8px;margin-bottom:16px}
.macro-toggle-btn{flex:1;background:var(--iron-3);border:1px solid var(--steel);border-radius:var(--r);color:var(--text-muted);font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:2px;padding:10px;cursor:pointer;transition:all .15s;text-transform:uppercase;-webkit-tap-highlight-color:transparent}
.macro-toggle-btn.active{background:var(--gold-dark);border-color:var(--gold);color:var(--gold-bright)}
.macro-day-type{font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:3px;color:var(--text-muted);text-align:center;margin-bottom:4px;text-transform:uppercase}
.macro-total-cal{font-family:'Bebas Neue',cursive;font-size:56px;letter-spacing:4px;color:var(--gold);text-align:center;line-height:1;margin-bottom:16px}
.cal-unit{font-size:22px;color:var(--gold-muted);letter-spacing:2px}
.macros-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.macro-card{background:var(--iron-3);border:1px solid var(--steel);border-radius:var(--rl);padding:14px 10px;text-align:center;position:relative;overflow:hidden}
.macro-card::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px}
.macro-card.protein::after{background:#C0392B}.macro-card.carbs::after{background:#F39C12}.macro-card.fat::after{background:#27AE60}
.macro-icon{font-size:22px;margin-bottom:6px}
.macro-amount{font-family:'Bebas Neue',cursive;font-size:28px;letter-spacing:2px;color:var(--gold);line-height:1}
.macro-name{font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:2px;color:var(--text-muted);margin-top:3px;text-transform:uppercase}
.macro-kcal{font-size:11px;color:var(--text-dim);margin-top:3px}
.macro-notes{margin-bottom:20px}
.alcohol-rules{display:flex;flex-direction:column;gap:8px}
.rule{background:var(--iron-3);border-radius:var(--r);padding:10px 14px;font-size:13px;color:var(--text-muted)}
/* SUPPLEMENTS */
.supps-list{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.supp-card{display:flex;align-items:center;justify-content:space-between;background:var(--iron-3);border:1px solid var(--steel);border-radius:var(--rl);padding:14px 16px}
.supp-name{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;letter-spacing:1px;color:var(--text-main)}
.supp-timing{font-size:12px;color:var(--text-muted);margin-top:3px}
.supp-dose{font-family:'Bebas Neue',cursive;font-size:18px;letter-spacing:2px;color:var(--gold);white-space:nowrap;margin-left:12px}
.supp-disclaimer{font-size:12px;color:var(--text-dim);text-align:center;padding:8px;font-style:italic}
/* ANIMATIONS */
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.exercise-card:nth-child(1){animation-delay:.05s}.exercise-card:nth-child(2){animation-delay:.1s}
.exercise-card:nth-child(3){animation-delay:.15s}.exercise-card:nth-child(4){animation-delay:.2s}
.exercise-card:nth-child(5){animation-delay:.25s}.exercise-card:nth-child(6){animation-delay:.3s}
.exercise-card:nth-child(7){animation-delay:.35s}.exercise-card:nth-child(8){animation-delay:.4s}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
input[type=number]{-moz-appearance:textfield}
@media(max-width:360px){.view-title{font-size:24px}.workout-day-name{font-size:26px}.ex-name{font-size:14px}}
</style>
</head>
<body>
<div id="app">
  <header id="top-bar">
    <div class="app-brand">IRON<span>SCHWARZENEGGER PROGRAMME</span></div>
    <div class="offline-badge">OFFLINE READY</div>
  </header>
  <main id="main-content">
    <div style="display:flex;align-items:center;justify-content:center;height:60vh">
      <div style="text-align:center">
        <div style="font-family:'Bebas Neue',cursive;font-size:32px;letter-spacing:6px;color:#C9A84C">LOADING</div>
        <div style="font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:3px;color:#4A4A6A;margin-top:8px">PREPARING YOUR PROGRAMME...</div>
      </div>
    </div>
  </main>
  <nav id="bottom-nav"></nav>
</div>

<script>
// ============================================================
// DATA
// ============================================================
const PROGRAMME_START = new Date('2026-06-01');
const PROGRAMME_END   = new Date('2027-03-19');

const QUOTES = [
  {text:"The mind is the limit. As long as the mind can envision the fact that you can do something, you can do it.",attr:"Arnold Schwarzenegger"},
  {text:"Strength does not come from winning. Your struggles develop your strengths.",attr:"Arnold Schwarzenegger"},
  {text:"The worst thing I can be is the same as everybody else.",attr:"Arnold Schwarzenegger"},
  {text:"You can have results or excuses. Not both.",attr:"Arnold Schwarzenegger"},
  {text:"Just remember, you can't climb the ladder of success with your hands in your pockets.",attr:"Arnold Schwarzenegger"},
  {text:"The last three or four reps is what makes the muscle grow.",attr:"Arnold Schwarzenegger"},
  {text:"Everybody pities the weak; jealousy you have to earn.",attr:"Arnold Schwarzenegger"},
  {text:"The pain you feel today will be the strength you feel tomorrow.",attr:"Arnold Schwarzenegger"},
  {text:"Milk is for babies. When you grow up you have to drink beer.",attr:"Arnold Schwarzenegger"},
  {text:"If you want to turn a vision into reality, you have to give 100% and never stop believing.",attr:"Arnold Schwarzenegger"},
  {text:"The Iron never lies to you.",attr:"Arnold Schwarzenegger"},
  {text:"I was born to be a champion.",attr:"Arnold Schwarzenegger"},
  {text:"Pain is temporary. Glory is forever.",attr:"Arnold Schwarzenegger"},
  {text:"You have to remember something: everybody pities the weak; jealousy you have to earn.",attr:"Arnold Schwarzenegger"},
  {text:"I do the same exercises I did 50 years ago and they still work.",attr:"Arnold Schwarzenegger"}
];

const MACROS = {
  training:{calories:2800,protein:200,carbs:290,fat:75},
  rest:{calories:2400,protein:200,carbs:190,fat:70}
};

const SUPPLEMENTS = [
  {name:"Creatine Monohydrate",dose:"5g",timing:"Daily with food"},
  {name:"Whey Isolate",dose:"30–40g",timing:"Post-workout"},
  {name:"Omega-3 Fish Oil",dose:"2–3g EPA+DHA",timing:"With meals"},
  {name:"Vitamin D3 + K2",dose:"3,000 IU",timing:"Morning"},
  {name:"Magnesium Glycinate",dose:"400mg",timing:"Evening"},
  {name:"Caffeine / Pre-workout",dose:"150–200mg",timing:"30 min pre-session"},
  {name:"Collagen Peptides",dose:"10g",timing:"Pre-workout (joint support)"}
];

// ============================================================
// WORKOUT TEMPLATES  Mon=1 Tue=2(rest) Wed=3 Thu=4(rest) Fri=5 Sat=6 Sun=0
// ============================================================
const P1 = {

function getWeekNumber(date){
  const ms=date-PROGRAMME_START;
  return Math.floor(ms/604800000)+1;
}
function isRestDay(dow){return dow===2||dow===4}
function isProgrammeDay(date){return date>=PROGRAMME_START&&date<=PROGRAMME_END}
function getPhaseForDate(date){
  const w=getWeekNumber(date);
  if(w<=6) return P1;
  if(w<=18) return P2;
  if(w<=30) return P3;
  return P4;
}
function getWorkoutForDate(date){
  if(!isProgrammeDay(date)) return null;
  const dow=date.getDay();
  if(isRestDay(dow)) return null;
  const ph=getPhaseForDate(date);
  return ph.days[dow]?{...ph.days[dow],phaseName:ph.name,week:getWeekNumber(date)}:null;
}

// INDEXEDDB STORAGE
// ============================================================
const DB_NAME='IronProg',DB_VER=1;
let _db=null;
function openDB(){
  return new Promise((res,rej)=>{
    if(_db) return res(_db);
    const r=indexedDB.open(DB_NAME,DB_VER);
    r.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains('workouts')) d.createObjectStore('workouts',{keyPath:'dk'});
      if(!d.objectStoreNames.contains('bodyweight')) d.createObjectStore('bodyweight',{keyPath:'date'});
    };
    r.onsuccess=e=>{_db=e.target.result;res(_db)};
    r.onerror=e=>rej(e.target.error);
  });
}
function dk(d){return d.toISOString().split('T')[0]}
async function saveLog(date,data){
  const db=await openDB();
  return new Promise((res,rej)=>{
    const tx=db.transaction('workouts','readwrite');
    tx.objectStore('workouts').put({dk:dk(date),...data});
    tx.oncomplete=res;tx.onerror=e=>rej(e.target.error);
  });
}
async function loadLog(date){
  const db=await openDB();
  return new Promise((res,rej)=>{
    const tx=db.transaction('workouts','readonly');
    const r=tx.objectStore('workouts').get(dk(date));
    r.onsuccess=e=>res(e.target.result||null);
    r.onerror=e=>rej(e.target.error);
  });
}
async function loadAllLogs(){
  const db=await openDB();
  return new Promise((res,rej)=>{
    const tx=db.transaction('workouts','readonly');
    const r=tx.objectStore('workouts').getAll();
    r.onsuccess=e=>res(e.target.result||[]);
    r.onerror=e=>rej(e.target.error);
  });
}
async function saveWeight(date,kg){
  const db=await openDB();
  return new Promise((res,rej)=>{
    const tx=db.transaction('bodyweight','readwrite');
    tx.objectStore('bodyweight').put({date:dk(date),kg});
    tx.oncomplete=res;tx.onerror=e=>rej(e.target.error);
  });
}
async function loadAllWeights(){
  const db=await openDB();
  return new Promise((res,rej)=>{
    const tx=db.transaction('bodyweight','readonly');
    const r=tx.objectStore('bodyweight').getAll();
    r.onsuccess=e=>res((e.target.result||[]).sort((a,b)=>a.date.localeCompare(b.date)));
    r.onerror=e=>rej(e.target.error);
  });
}

async function init(){
  await openDB();
  rotateQuote();
  setInterval(rotateQuote,30000);
  renderNav();
  await showView('today');
  if('serviceWorker' in navigator){
    // inline SW via blob for offline
    const swCode=`
      const C='iron-v2';
      self.addEventListener('install',e=>{self.skipWaiting()});
      self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(k=>Promise.all(k.filter(n=>n!==C).map(n=>caches.delete(n)))))});
      self.addEventListener('fetch',e=>{e.respondWith(fetch(e.request).catch(()=>caches.match(e.request)))});
    `;
    try{
      const blob=new Blob([swCode],{type:'application/javascript'});
      const url=URL.createObjectURL(blob);
      navigator.serviceWorker.register(url).catch(()=>{});
    }catch(e){}
  }
}

function rotateQuote(){
  const q=QUOTES[quoteIdx%QUOTES.length];
  const el=document.getElementById('quote-text');
  const at=document.getElementById('quote-attr');
  if(el){el.style.opacity=0;setTimeout(()=>{el.textContent=`"${q.text}"`;if(at)at.textContent=`— ${q.attr}`;el.style.opacity=1},400)}
  quoteIdx++;
}

// ============================================================
// NAV
// ============================================================
function renderNav(){
  const items=[
    {id:'today',icon:'🏋️',label:'TODAY'},
    {id:'calendar',icon:'📅',label:'CALENDAR'},
    {id:'progress',icon:'📊',label:'PROGRESS'},
    {id:'macros',icon:'🥩',label:'MACROS'},
    {id:'supplements',icon:'💊',label:'SUPPS'}
  ];
  document.getElementById('bottom-nav').innerHTML=items.map(i=>`
    <button class="nav-btn ${curView===i.id?'active':''}" onclick="showView('${i.id}')">
      <span class="nav-icon">${i.icon}</span>
      <span class="nav-label">${i.label}</span>
    </button>`).join('');
}

async function showView(v){
  curView=v;renderNav();
  const m=document.getElementById('main-content');
  m.style.opacity=0;
  setTimeout(async()=>{
    if(v==='today') await renderToday();
    else if(v==='calendar') await renderCalendar();
    else if(v==='progress') await renderProgress();
    else if(v==='macros') renderMacros();
    else renderSupplements();
    m.style.opacity=1;
  },150);
}

// ============================================================
// TODAY
// ============================================================
async function renderToday(date){
  if(date){curDate=date;}
  const m=document.getElementById('main-content');
  const workout=getWorkoutForDate(curDate);
  const log=await loadLog(curDate);
  curLog=log?{...log}:{sets:{},completed:false};
  const isRest=isRestDay(curDate.getDay());
  const isActive=isProgrammeDay(curDate);
  const dateStr=curDate.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const week=isActive?getWeekNumber(curDate):null;

  if(!isActive){
    m.innerHTML=`
      <div class="view-header"><div><h1 class="view-title">THE IRON PROGRAMME</h1><p class="view-sub">Jun 1, 2026 – Mar 19, 2027</p></div></div>
      <div class="quote-block"><p id="quote-text" class="quote-text"></p><p id="quote-attr" class="quote-attr"></p></div>
      <div class="rest-card"><div class="rest-icon">🏆</div><h2>OUTSIDE PROGRAMME</h2><p>${dateStr}</p><p style="margin-top:8px;color:var(--gold-muted)">Programme starts June 1st, 2026</p></div>
      ${dateNav()}`;
    rotateQuote();return;
  }
  if(isRest){
    const ph=getPhaseForDate(curDate);
    m.innerHTML=`
      <div class="view-header"><div><h1 class="view-title">THE IRON PROGRAMME</h1><p class="view-sub">${ph.name} · Week ${week}</p></div></div>
      <div class="quote-block"><p id="quote-text" class="quote-text"></p><p id="quote-attr" class="quote-attr"></p></div>
      <div class="date-display">${dateStr}</div>
      <div class="rest-card">
        <div class="rest-icon">⚡</div><h2>REST DAY</h2><p>Champions recover. Champions grow.</p>
        <div class="rest-tips">
          <div class="tip">💧 Hydrate 3–4L water</div>
          <div class="tip">🥩 Hit your protein: 200g</div>
          <div class="tip">😴 8 hours sleep — non-negotiable</div>
          <div class="tip">🧘 Light stretching or walk</div>
        </div>
      </div>
      ${dateNav()}`;
    rotateQuote();return;
  }
  const ph=getPhaseForDate(curDate);
  const done=curLog.completed||false;
  m.innerHTML=`
    <div class="view-header">
      <div><h1 class="view-title">THE IRON PROGRAMME</h1><p class="view-sub">${ph.name} · Week ${week}</p></div>
      ${done?'<div class="completed-badge">✓ DONE</div>':''}
    </div>
    <div class="quote-block"><p id="quote-text" class="quote-text"></p><p id="quote-attr" class="quote-attr"></p></div>
    <div class="date-display">${dateStr}</div>
    <div class="workout-header-card">
      <div class="workout-day-name">${workout.name}</div>
      <div class="workout-muscles">${workout.muscles}</div>
    </div>
    <div class="exercises-list">${workout.exercises.map((ex,i)=>renderEx(ex,i,curLog)).join('')}</div>
    <div class="cardio-card">
      <div class="cardio-header"><span class="cardio-icon">🔥</span><span class="cardio-title">CARDIO FINISHER</span></div>
      <div class="cardio-type">${workout.cardio.type}</div>
      <div class="cardio-detail">${workout.cardio.duration} · ${workout.cardio.protocol}</div>
      <label class="cardio-check">
        <input type="checkbox" ${curLog.cardioDone?'checked':''} onchange="toggleCardio(this.checked)">
        <span class="check-label">CARDIO COMPLETE</span>
      </label>
    </div>
    <div class="complete-section">
      <button class="complete-btn ${done?'completed':''}" onclick="toggleComplete()">${done?'✓ SESSION COMPLETE':'MARK SESSION COMPLETE'}</button>
      <p class="autosave-status" id="as-status">Auto-saved</p>
    </div>
    ${dateNav()}`;
  rotateQuote();
}

function renderEx(ex,idx,log){
  const exLog=log.sets&&log.sets[idx]?log.sets[idx]:{};
  const rows=Array.from({length:ex.sets},(_,s)=>{
    const sl=exLog[s]||{};
    return `<div class="set-row" id="sr-${idx}-${s}">
      <span class="set-num">${s+1}</span>
      <input type="number" class="set-input" placeholder="kg" value="${sl.kg||''}" oninput="logSet(${idx},${s},'kg',this.value)" step="0.5" min="0">
      <input type="number" class="set-input" placeholder="reps" value="${sl.reps||''}" oninput="logSet(${idx},${s},'reps',this.value)" min="0" max="100">
      <button class="set-check ${sl.done?'set-done':''}" onclick="toggleSet(${idx},${s})">${sl.done?'✓':''}</button>
    </div>`;
  }).join('');
  return `<div class="exercise-card">
    <div class="ex-header">
      <div class="ex-num">${String(idx+1).padStart(2,'0')}</div>
      <div class="ex-info">
        <div class="ex-name">${ex.name}</div>
        <div class="ex-prescription">${ex.sets} sets × ${ex.reps} reps · Rest ${ex.rest}</div>
        <div class="ex-notes">${ex.notes}</div>
      </div>
    </div>
    <div class="sets-container">
      <div class="sets-header-row"><span class="sets-col-label">SET</span><span class="sets-col-label">KG</span><span class="sets-col-label">REPS</span><span class="sets-col-label">✓</span></div>
      ${rows}
    </div>
  </div>`;
}

function dateNav(){
  return `<div class="date-nav">
    <button class="date-nav-btn" onclick="navDate(-1)">◀ PREV</button>
    <button class="date-nav-btn today-btn" onclick="goToday()">TODAY</button>
    <button class="date-nav-btn" onclick="navDate(1)">NEXT ▶</button>
  </div>`;
}
function navDate(d){const n=new Date(curDate);n.setDate(n.getDate()+d);n.setHours(0,0,0,0);curDate=n;renderToday();}
function goToday(){const t=new Date();t.setHours(0,0,0,0);curDate=t<PROGRAMME_START?new Date(PROGRAMME_START):t;renderToday();}

// ============================================================
// LOGGING
// ============================================================
function logSet(ei,si,field,val){
  if(!curLog.sets) curLog.sets={};
  if(!curLog.sets[ei]) curLog.sets[ei]={};
  if(!curLog.sets[ei][si]) curLog.sets[ei][si]={};
  curLog.sets[ei][si][field]=val;
  schedSave();
}
function toggleSet(ei,si){
  if(!curLog.sets) curLog.sets={};
  if(!curLog.sets[ei]) curLog.sets[ei]={};
  if(!curLog.sets[ei][si]) curLog.sets[ei][si]={};
  const was=curLog.sets[ei][si].done||false;
  curLog.sets[ei][si].done=!was;
  const btn=document.querySelector(`#sr-${ei}-${si} .set-check`);
  if(btn){btn.classList.toggle('set-done',!was);btn.textContent=!was?'✓':'';}
  schedSave();
}
function toggleCardio(v){curLog.cardioDone=v;schedSave();}
async function toggleComplete(){curLog.completed=!curLog.completed;await saveLog(curDate,curLog);renderToday(curDate);}
function schedSave(){
  const s=document.getElementById('as-status');
  if(s) s.textContent='Saving...';
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    await saveLog(curDate,curLog);
    const s=document.getElementById('as-status');
    if(s) s.textContent='Auto-saved ✓';
  },800);
}

// ============================================================
// CALENDAR
// ============================================================
async function renderCalendar(){
  const m=document.getElementById('main-content');
  const allLogs=await loadAllLogs();
  const lmap={};allLogs.forEach(l=>{lmap[l.dk]=l;});
  const today=new Date();today.setHours(0,0,0,0);
  const vd=new Date(curDate.getFullYear(),curDate.getMonth(),1);
  const monthName=vd.toLocaleDateString('en-GB',{month:'long',year:'numeric'}).toUpperCase();
  const firstDay=vd.getDay();
  const dim=new Date(vd.getFullYear(),vd.getMonth()+1,0).getDate();
  const offset=firstDay===0?6:firstDay-1;
  let cells='';
  for(let i=0;i<offset;i++) cells+='<div class="cal-cell empty"></div>';
  for(let d=1;d<=dim;d++){
    const cd=new Date(vd.getFullYear(),vd.getMonth(),d);cd.setHours(0,0,0,0);
    const key=dk(cd),log=lmap[key];
    const isToday=cd.getTime()===today.getTime();
    const isSel=cd.getTime()===curDate.getTime();
    const inP=isProgrammeDay(cd),rest=isRestDay(cd.getDay());
    const isDone=log&&log.completed,isPast=cd<today;
    let cls='cal-cell';
    if(isToday) cls+=' cal-today';
    if(isSel) cls+=' cal-selected';
    if(!inP) cls+=' cal-inactive';
    else if(rest) cls+=' cal-rest';
    else if(isDone) cls+=' cal-done';
    else if(isPast&&!rest) cls+=' cal-missed';
    else cls+=' cal-workout';
    cells+=`<div class="${cls}" onclick="calSelect(${cd.getTime()})">
      <span class="cal-day-num">${d}</span>
      ${isDone?'<span class="cal-dot done-dot">✓</span>':''}
      ${rest&&inP?'<span class="cal-dot rest-dot">R</span>':''}
    </div>`;
  }
  m.innerHTML=`
    <div class="view-header"><h1 class="view-title">TRAINING CALENDAR</h1></div>
    <div class="cal-nav">
      <button class="cal-nav-btn" onclick="calMonth(-1)">◀</button>
      <span class="cal-month-name">${monthName}</span>
      <button class="cal-nav-btn" onclick="calMonth(1)">▶</button>
    </div>
    <div class="cal-legend">
      <span class="leg leg-done">✓ Done</span>
      <span class="leg leg-workout" style="color:var(--gold)">● Training</span>
      <span class="leg">R Rest</span>
      <span class="leg leg-missed" style="color:var(--red)">○ Missed</span>
    </div>
    <div class="calendar-grid">
      <div class="cal-weekday">M</div><div class="cal-weekday">T</div><div class="cal-weekday">W</div>
      <div class="cal-weekday">T</div><div class="cal-weekday">F</div><div class="cal-weekday">S</div><div class="cal-weekday">S</div>
      ${cells}
    </div>`;
}
function calSelect(ts){curDate=new Date(ts);curDate.setHours(0,0,0,0);showView('today');}
function calMonth(d){curDate=new Date(curDate.getFullYear(),curDate.getMonth()+d,1);renderCalendar();}

// ============================================================
// PROGRESS
// ============================================================
async function renderProgress(){
  const m=document.getElementById('main-content');
  const [weights,allLogs]=await Promise.all([loadAllWeights(),loadAllLogs()]);
  const totalDone=allLogs.filter(l=>l.completed).length;
  let totalSess=0;
  const now=new Date();now.setHours(0,0,0,0);
  const d=new Date(PROGRAMME_START);
  while(d<=now&&d<=PROGRAMME_END){if(!isRestDay(d.getDay())&&isProgrammeDay(d))totalSess++;d.setDate(d.getDate()+1);}
  const pct=totalSess>0?Math.round((totalDone/totalSess)*100):0;
  const lastKg=weights.length>0?weights[weights.length-1].kg:'—';
  m.innerHTML=`
    <div class="view-header"><h1 class="view-title">PROGRESS</h1><p class="view-sub">The Iron Never Lies</p></div>
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-value">${totalDone}</div><div class="stat-label">SESSIONS DONE</div></div>
      <div class="stat-card"><div class="stat-value">${totalSess}</div><div class="stat-label">TOTAL SO FAR</div></div>
      <div class="stat-card"><div class="stat-value">${pct}%</div><div class="stat-label">COMPLETION</div></div>
      <div class="stat-card"><div class="stat-value">${lastKg}</div><div class="stat-label">CURRENT KG</div></div>
    </div>
    <div class="progress-bar-container">
      <div class="progress-bar-label">Programme Progress</div>
      <div class="progress-bar-track"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
      <div class="progress-bar-pct">${pct}%</div>
    </div>
    <div class="weight-section">
      <h3 class="section-title">BODYWEIGHT TRACKER</h3>
      <div class="weight-input-row">
        <input type="number" id="new-wt" class="weight-input" placeholder="Enter weight (kg)" step="0.1" min="40" max="200">
        <button class="gold-btn" onclick="logWeight()">LOG</button>
      </div>
      ${weights.length>0?renderChart(weights):'<p class="no-data">No weight entries yet. Start logging to see your progress.</p>'}
    </div>`;
}
function renderChart(weights){
  if(weights.length<2){
    return `<div class="weight-history">${weights.map(w=>`<div class="weight-entry"><span class="we-date">${w.date}</span><span class="we-val">${w.kg} kg</span></div>`).join('')}</div>`;
  }
  const r=weights.slice(-20);
  const mn=Math.min(...r.map(w=>w.kg))-1,mx=Math.max(...r.map(w=>w.kg))+1;
  const pts=r.map((w,i)=>{const x=(i/(r.length-1))*100,y=60-((w.kg-mn)/(mx-mn))*60;return `${x},${y}`;}).join(' ');
  const ch=(r[r.length-1].kg-r[0].kg).toFixed(1);
  const chs=ch>0?'+':'';
  return `<div class="chart-container">
    <svg viewBox="0 0 100 60" class="weight-chart" preserveAspectRatio="none">
      <polyline points="${pts}" fill="none" stroke="#C9A84C" stroke-width="0.8"/>
      ${r.map((w,i)=>{const x=(i/(r.length-1))*100,y=60-((w.kg-mn)/(mx-mn))*60;return `<circle cx="${x}" cy="${y}" r="1" fill="#C9A84C"/>`;}).join('')}
    </svg>
    <div class="chart-labels">
      <span>${r[0].date.slice(5)}</span>
      <span class="change-label ${ch<0?'neg':'pos'}">${chs}${ch} kg</span>
      <span>${r[r.length-1].date.slice(5)}</span>
    </div>
  </div>
  <div class="weight-history">${weights.slice(-8).reverse().map(w=>`
    <div class="weight-entry">
      <span class="we-date">${new Date(w.date).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</span>
      <span class="we-val">${w.kg} kg</span>
    </div>`).join('')}</div>`;
}
async function logWeight(){
  const inp=document.getElementById('new-wt');
  const v=parseFloat(inp.value);
  if(!v||v<30||v>250) return;
  await saveWeight(new Date(),v);
  inp.value='';
  renderProgress();
}

// ============================================================
// MACROS
// ============================================================
function renderMacros(){
  const m=document.getElementById('main-content');
  const todayDow=new Date().getDay();
  const todayRest=isRestDay(todayDow);
  const todayM=todayRest?MACROS.rest:MACROS.training;
  m.innerHTML=`
    <div class="view-header"><h1 class="view-title">MACROS</h1><p class="view-sub">Fuel the Machine</p></div>
    <div class="macros-type-toggle">
      <button class="macro-toggle-btn ${!todayRest?'active':''}" onclick="switchMacro('training',this)">TRAINING DAY</button>
      <button class="macro-toggle-btn ${todayRest?'active':''}" onclick="switchMacro('rest',this)">REST DAY</button>
    </div>
    <div id="macro-display">${macroCards(todayM,todayRest?'REST DAY':'TRAINING DAY')}</div>
    <div class="macro-notes">
      <h3 class="section-title">ALCOHOL PROTOCOL</h3>
      <div class="alcohol-rules">
        <div class="rule">🍺 Max 3–4 drinks per week to preserve results</div>
        <div class="rule">⏰ No alcohol within 3hrs post-workout</div>
        <div class="rule">📊 Budget ~150–200 kcal per drink from fat/carb allowance</div>
        <div class="rule">💧 Match every drink with a glass of water</div>
      </div>
    </div>`;
}
function macroCards(m,label){
  return `<div class="macro-day-type">${label}</div>
    <div class="macro-total-cal">${m.calories} <span class="cal-unit">kcal</span></div>
    <div class="macros-grid">
      <div class="macro-card protein"><div class="macro-icon">🥩</div><div class="macro-amount">${m.protein}g</div><div class="macro-name">PROTEIN</div><div class="macro-kcal">${m.protein*4} kcal</div></div>
      <div class="macro-card carbs"><div class="macro-icon">🍚</div><div class="macro-amount">${m.carbs}g</div><div class="macro-name">CARBS</div><div class="macro-kcal">${m.carbs*4} kcal</div></div>
      <div class="macro-card fat"><div class="macro-icon">🥑</div><div class="macro-amount">${m.fat}g</div><div class="macro-name">FAT</div><div class="macro-kcal">${m.fat*9} kcal</div></div>
    </div>`;
}
function switchMacro(type,btn){
  const m=type==='rest'?MACROS.rest:MACROS.training;
  document.getElementById('macro-display').innerHTML=macroCards(m,type==='rest'?'REST DAY':'TRAINING DAY');
  document.querySelectorAll('.macro-toggle-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

function renderSupplements(){
  const m=document.getElementById('main-content');

}
